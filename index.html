<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Big Custom Buttons</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 25px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 20px;
      justify-items: center;
    }

    .big-button {
      width: 400px;
      height: 600px;
      border: none;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background-size: cover;
      background-position: center;
      transition: transform 0.2s;
    }

    .big-button:hover {
      transform: scale(1.03);
    }

    .overlay {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 20px;
      background: rgba(0,0,0,0.6);
      font-size: 28px;
      font-weight: bold;
      color: white;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <h1>Big Custom Image Buttons</h1>

  <div class="container" id="buttons"></div>

  <script>
    // Customize each button here
    const buttons = [
      {
        name: "Google",
        link: "https://google.com",
        image: "https://picsum.photos/400/600?random=1"
      },
      {
        name: "YouTube",
        link: "https://youtube.com",
        image: "https://picsum.photos/400/600?random=2"
      },
      {
        name: "GitHub",
        link: "https://github.com",
        image: "https://picsum.photos/400/600?random=3"
      },
      {
        name: "No Link",
        link: "",
        image: "https://picsum.photos/400/600?random=4"
      }
    ];

    const container = document.getElementById("buttons");

    for (let i = 0; i < 50; i++) {

      const data = buttons[i] || {
        name: `Button ${i + 1}`,
        link: "",
        image: "https://picsum.photos/400/600?random=" + (i + 1)
      };

      const btn = document.createElement("button");
      btn.className = "big-button";

      btn.style.backgroundImage = `url('${data.image}')`;

      btn.innerHTML = `
        <div class="overlay">${data.name}</div>
      `;

      btn.onclick = () => {
        if (data.link && data.link.trim() !== "") {
          window.location.href = data.link;
        } else {
          alert("No link found");
        }
      };

      container.appendChild(btn);
    }
  </script>

</body>
</html>
