<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Green Button Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b3d0b;
      color: white;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 42px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 30px;
      justify-items: center;
    }

    .button-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .button-title {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .big-button {
      width: 400px;
      height: 600px;
      border: none;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      background-size: cover;
      background-position: center;
      transition: transform 0.2s;
    }

    .big-button:hover {
      transform: scale(1.03);
    }

    /* Popup background */
    .popup-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 999;
    }

    /* Popup box */
    .popup {
      width: 320px;
      padding: 30px;
      background: #1d1d1d;
      border-radius: 20px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .popup h2 {
      margin: 0 0 20px;
      font-size: 32px;
    }

    .popup button {
      padding: 12px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #2d89ef;
      color: white;
      cursor: pointer;
    }

    .popup button:hover {
      background: #1b5fa7;
    }
  </style>
</head>
<body>

  <h1>Dark Green Button Website</h1>

  <div class="container" id="buttons"></div>

  <!-- Popup -->
  <div class="popup-bg" id="popupBg">
    <div class="popup">
      <h2>Thanks!</h2>
      <button onclick="closePopup()">OK</button>
    </div>
  </div>

  <script>
    // Customize buttons here
    const buttons = [
      {
        name: "Google",
        link: "https://google.com",
        image: "https://picsum.photos/400/600?random=1"
      },
      {
        name: "YouTube",
        link: "https://youtube.com",
        image: "https://picsum.photos/400/600?random=2"
      },
      {
        name: "GitHub",
        link: "https://github.com",
        image: "https://picsum.photos/400/600?random=3"
      },
      {
        name: "No Link",
        link: "",
        image: "https://picsum.photos/400/600?random=4"
      }
    ];

    const container = document.getElementById("buttons");
    const popupBg = document.getElementById("popupBg");

    function showPopup(link) {
      popupBg.style.display = "flex";
      popupBg.setAttribute("data-link", link);
    }

    function closePopup() {
      popupBg.style.display = "none";

      const link = popupBg.getAttribute("data-link");

      if (link && link.trim() !== "") {
        window.location.href = link;
      } else {
        alert("No link found");
      }
    }

    for (let i = 0; i < 50; i++) {

      const data = buttons[i] || {
        name: `Button ${i + 1}`,
        link: "",
        image: "https://picsum.photos/400/600?random=" + (i + 1)
      };

      // Wrapper
      const wrapper = document.createElement("div");
      wrapper.className = "button-wrapper";

      // Title
      const title = document.createElement("div");
      title.className = "button-title";
      title.textContent = data.name;

      // Button
      const btn = document.createElement("button");
      btn.className = "big-button";
      btn.style.backgroundImage = `url('${data.image}')`;

      btn.onclick = () => {
        showPopup(data.link);
      };

      wrapper.appendChild(title);
      wrapper.appendChild(btn);

      container.appendChild(wrapper);
    }
  </script>

</body>
</html>
