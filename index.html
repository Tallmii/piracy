<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Custom Buttons</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      max-width: 1000px;
      margin: auto;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2d89ef;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1b5fa7;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h1>50 Custom Buttons</h1>

  <div class="container" id="buttons"></div>

  <script>
    // Edit button names and links separately here
    const buttons = [
      { name: "Google", link: "https://google.com" },
      { name: "YouTube", link: "https://youtube.com" },
      { name: "GitHub", link: "https://github.com" },
      { name: "No Link Button", link: "" },
      { name: "OpenAI", link: "https://openai.com" }
    ];

    const container = document.getElementById("buttons");

    for (let i = 0; i < 50; i++) {
      const data = buttons[i] || {
        name: `Button ${i + 1}`,
        link: ""
      };

      const btn = document.createElement("button");
      btn.textContent = data.name;

      btn.onclick = () => {
        if (data.link && data.link.trim() !== "") {
          window.location.href = data.link;
        } else {
          alert("No link found");
        }
      };

      container.appendChild(btn);
    }
  </script>

</body>
</html>
